<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="طيّب قلبك — تطبيق للتأمل في أحاديث الأربعين النووية. السياسات والشروط وطلب حذف الحساب.">
<title>طيّب قلبك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #F8F3EA;
    --card: #F2ECE0;
    --ink: #243329;
    --muted: #4A5D52;
    --gold: #7A5B0E;
    --line: #D6BE88;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131A15;
      --card: #1C2620;
      --ink: #F7F5EE;
      --muted: #B5C0B8;
      --gold: #D9B44A;
      --line: #3A4A3F;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Tajawal, "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.75;
    min-height: 100vh;
    display: grid;
    place-items: center;
  }
  .wrap {
    width: 100%;
    max-width: 560px;
    padding-inline: 20px;
    padding-block: 56px;
  }
  .emblem {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: #15362B;
    display: grid;
    place-items: center;
    margin: 0 auto 20px;
  }
  .emblem svg { width: 38px; height: 38px; display: block; }
  h1 { font-size: 30px; font-weight: 700; margin: 0 0 6px; text-align: center; }
  .tagline {
    color: var(--muted);
    text-align: center;
    margin: 0 0 32px;
  }
  nav { display: grid; gap: 12px; }
  a.card {
    display: block;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 20px;
    text-decoration: none;
    color: inherit;
  }
  a.card:hover { border-color: var(--gold); }
  a.card:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  a.card .t { font-weight: 700; color: var(--gold); display: block; }
  a.card .d { color: var(--muted); font-size: 14.5px; }
  footer {
    margin-top: 32px;
    color: var(--muted);
    font-size: 13.5px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="emblem" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#D9B44A" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 21C12 21 3.5 15.4 3.5 9.2A4.7 4.7 0 0 1 12 6.6a4.7 4.7 0 0 1 8.5 2.6C20.5 15.4 12 21 12 21Z"/>
      <path d="M12 18.5V9"/>
      <path d="M12 13.2c1.6-.2 3-1.5 3.4-3.4-1.8-.2-3.2 1.2-3.4 3.4Z"/>
    </svg>
  </div>
  <h1>طيّب قلبك</h1>
  <p class="tagline">أحاديث نبوية وهدايات قلبية — تأمل يومي في الأربعين النووية.</p>
  <nav>
    <a class="card" href="privacy-policy.html">
      <span class="t">سياسة الخصوصية</span>
      <span class="d">ما الذي يجمعه التطبيق، ولماذا، وأين يُحفظ.</span>
    </a>
    <a class="card" href="terms-of-use.html">
      <span class="t">شروط الاستخدام</span>
      <span class="d">قواعد المشاركة في المجتمع وحدود المسؤولية.</span>
    </a>
    <a class="card" href="delete-account.html">
      <span class="t">حذف الحساب</span>
      <span class="d">كيف تحذف حسابك وبياناتك، من داخل التطبيق أو بدونه.</span>
    </a>
  </nav>
  <footer>تطبيق «طيّب قلبك» — أحاديث نبوية وهدايات قلبية</footer>
</div>
</body>
</html>
