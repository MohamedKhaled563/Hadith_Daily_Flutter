# Codemagic builds the iOS app for us, because Xcode only runs on a Mac and
# this project is developed on Windows. Android does not need this: the
# signed .aab is built locally (docs/android-release-reminding-steps.md).
#
# Codemagic only reads this file once the app's settings in Codemagic are
# switched to "codemagic.yaml" instead of the Workflow Editor.
#
# ios-unsigned (first workflow below) needs none of this and can run today.
#
# For ios-release, two things must exist before the first run, and both need
# the paid Apple Developer account:
#   1. An App Store Connect API key, added in Codemagic under
#      Team settings -> Integrations -> Developer Portal, and named exactly
#      as in `integrations:` below.
#   2. The App ID com.prodktstudio.tayebqalbak registered in the Apple
#      Developer portal with the "Sign in with Apple" capability turned on
#      (ios/Runner/Runner.entitlements asks for it, so signing fails without).

workflows:
  # An unsigned .ipa for testing on our own iPhones before the Apple Developer
  # account exists. Needs no Apple account and no signing setup: install the
  # file with Sideloadly or AltStore and a free Apple ID. Sign in with Apple
  # does not work in a sideloaded build (free Apple IDs can't use that
  # capability); everything else does. This is NOT the App Store build: that
  # is ios-release below.
  ios-unsigned:
    name: iOS unsigned IPA (sideload test)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build the app without signing
        script: |
          flutter build ios --release --no-codesign \
            --build-number=$PROJECT_BUILD_NUMBER
      - name: Package it as an .ipa
        script: |
          # An .ipa is just Runner.app inside a folder called Payload, zipped.
          cd "$CM_BUILD_DIR/build/ios/iphoneos"
          rm -rf Payload
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry "$CM_BUILD_DIR/tayebqalbak-unsigned.ipa" Payload
    artifacts:
      - tayebqalbak-unsigned.ipa

  ios-release:
    name: iOS release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Tayeb Qalbak ASC key
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.prodktstudio.tayebqalbak
    scripts:
      - name: Apply the fetched signing profiles to the Xcode project
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build the .ipa
        script: |
          # App Store Connect refuses a build number it has seen before, even
          # for a deleted build, and pubspec's "+1" never moves on its own.
          # Codemagic's counter goes up on every build, so each upload is
          # unique. The version name (1.0.0) still comes from pubspec.yaml.
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Upload debug symbols to Crashlytics
        script: |
          # Without the dSYMs, iOS crash reports in the Firebase console show
          # memory addresses instead of function names. The upload tool ships
          # inside the FirebaseCrashlytics package, under ios/Pods with
          # CocoaPods or under DerivedData with Swift Package Manager.
          # Never fails the build: a release with unreadable crash traces is
          # still a release worth shipping.
          UPLOAD=$(find "$CM_BUILD_DIR/ios/Pods" "$HOME/Library/Developer/Xcode/DerivedData" \
            -name upload-symbols -type f 2>/dev/null | head -1)
          DSYMS="$CM_BUILD_DIR/build/ios/archive/Runner.xcarchive/dSYMs"
          if [ -z "$UPLOAD" ] || [ ! -d "$DSYMS" ]; then
            echo "Crashlytics upload-symbols or dSYMs not found, skipping."
            exit 0
          fi
          "$UPLOAD" -gsp "$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist" \
            -p ios "$DSYMS" || echo "dSYM upload failed, continuing."
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Lands in TestFlight only. Submitting for review stays a manual
        # click in App Store Connect.
        submit_to_testflight: true
