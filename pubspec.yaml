name: hadith_app
description: "A calm, spiritual Hadith app for daily reflections based on An-Nawawi's Forty Hadiths."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  shared_preferences: ^2.3.3
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.0.0
  google_sign_in: ^7.2.0
  # Dashboard-only (lib/features/dashboard/) — the download/upload round
  # trip for bulk-editing dailyMessages in Excel. Both are pure-Dart, no
  # native plugin code, so they tree-shake out of the phone app builds,
  # which never import lib/features/dashboard/ at all.
  excel: ^4.0.6
  file_picker: ^12.2.0
  # Phone app only — schedules the morning/evening reminder notifications
  # (NotificationScheduler). Local-only, no FCM/server component, so it
  # stays on the free Spark plan like everything else.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.5
  # Widget-test-only: HomeScreen keeps every tab mounted (IndexedStack, so
  # ambient state survives tab switches — see home_screen.dart), which means
  # CommunityScreen/NotificationScheduler reach for FirebaseFirestore.instance
  # as soon as HomeScreen builds. setupFirebaseCoreMocks() registers a fake
  # default app so that lookup succeeds instead of throwing [core/no-app] in
  # tests, without needing a real backend.
  firebase_core_platform_interface: ^8.1.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icons/
    # hadiths.json / insights.json are generated from
    # "الأربعون_النووية_رسائل_يومية.xlsx" by tool/import_hadiths_v2.py and
    # tool/import_daily_messages_v2.py — do not hand-edit them.
    - assets/data/

  # Bundled so the app renders correctly offline and on first launch.
  # Previously these came from google_fonts, which registers variant-qualified
  # family names — so the 122 hardcoded `fontFamily: 'Tajawal'` references in
  # the app silently fell back to the system font. Both faces are OFL-licensed;
  # see assets/fonts/OFL-*.txt.
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
