name: hadith_app
description: "A calm, spiritual Hadith app for daily reflections based on An-Nawawi's Forty Hadiths."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  shared_preferences: ^2.3.3
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icons/
    # hadiths.json / insights.json are generated from "Hadith App DB.xlsx"
    # by tool/import_hadith_db.py — do not hand-edit them.
    - assets/data/

  # Bundled so the app renders correctly offline and on first launch.
  # Previously these came from google_fonts, which registers variant-qualified
  # family names — so the 122 hardcoded `fontFamily: 'Tajawal'` references in
  # the app silently fell back to the system font. Both faces are OFL-licensed;
  # see assets/fonts/OFL-*.txt.
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
