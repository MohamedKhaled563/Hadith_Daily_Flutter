<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8F4EC"/>
      <stop offset="45%" stop-color="#F8F3EA"/>
      <stop offset="60%" stop-color="#F5E8D6" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#F0D4B2"/>
      <stop offset="85%" stop-color="#E5C7A5"/>
      <stop offset="100%" stop-color="#728B78"/>
    </linearGradient>

    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFDF9E" stop-opacity="1"/>
      <stop offset="45%" stop-color="#F9BE74" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#F29F4C" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F8F3EA" stop-opacity="0"/>
    </radialGradient>

    <!-- Lake Reflection -->
    <linearGradient id="lakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ECD4AF"/>
      <stop offset="35%" stop-color="#A5C0B2"/>
      <stop offset="70%" stop-color="#6F8F7D"/>
      <stop offset="100%" stop-color="#557563"/>
    </linearGradient>
  </defs>

  <!-- Sky Base -->
  <rect x="0" y="0" width="420" height="900" fill="url(#skyGrad)"/>

  <!-- Birds in Sky (Top-Right) -->
  <g fill="#7A8778" opacity="0.65">
    <path d="M340 420 Q347 414 354 420 Q361 414 368 420 Q361 417 354 422 Q347 417 340 420 Z"/>
    <path d="M358 405 Q363 400 369 405 Q375 400 380 405 Q375 402 369 406 Q363 402 358 405 Z" transform="scale(0.85) translate(65, 55)"/>
    <path d="M372 415 Q376 411 381 415 Q386 411 390 415 Q386 413 381 416 Q376 413 372 415 Z" transform="scale(0.75) translate(120, 95)"/>
    <path d="M315 480 Q321 475 328 480 Q335 475 341 480 Q335 478 328 482 Q321 478 315 480 Z" transform="scale(0.8) translate(80, 80)"/>
    <path d="M295 500 Q300 496 306 500 Q312 496 317 500 Q312 498 306 502 Q300 498 295 500 Z" transform="scale(0.7) translate(130, 140)"/>
  </g>

  <!-- Distant Mountains Layer 1 -->
  <path d="M0 580 Q100 500 210 560 Q320 480 420 570 L420 900 L0 900 Z" fill="#9FB2A7" opacity="0.45"/>

  <!-- Mid-Range Mountains Layer 2 -->
  <path d="M0 610 Q120 530 210 595 Q300 525 420 620 L420 900 L0 900 Z" fill="#7D988A" opacity="0.7"/>

  <!-- Sun on the Horizon -->
  <circle cx="210" cy="625" r="54" fill="url(#sunGlow)"/>
  <circle cx="210" cy="625" r="32" fill="#FFE5B6" opacity="0.95"/>

  <!-- Lake Water Surface -->
  <path d="M80 635 L340 635 L420 760 L0 760 Z" fill="url(#lakeGrad)"/>

  <!-- Sunlight Shimmer on Lake -->
  <ellipse cx="210" cy="648" rx="42" ry="7" fill="#FFF5DC" opacity="0.85"/>
  <ellipse cx="210" cy="668" rx="65" ry="10" fill="#FDE4B4" opacity="0.65"/>
  <ellipse cx="210" cy="695" rx="90" ry="14" fill="#FCD59A" opacity="0.45"/>
  <ellipse cx="210" cy="725" rx="120" ry="16" fill="#F8C982" opacity="0.25"/>

  <!-- Mountain Slopes Left & Right bordering Lake -->
  <path d="M0 630 Q90 620 160 660 Q80 710 0 730 Z" fill="#587463" opacity="0.9"/>
  <path d="M420 630 Q330 620 260 660 Q340 710 420 730 Z" fill="#587463" opacity="0.9"/>

  <!-- Meadow Shore & Sandy Path -->
  <path d="M0 720 Q140 700 210 750 Q280 700 420 720 L420 900 L0 900 Z" fill="#5B7664"/>
  <path d="M140 900 Q200 780 210 750 Q220 780 280 900 Z" fill="#BFAF90" opacity="0.85"/>

  <!-- Jasmine White Flowers (Left Shore) -->
  <g fill="#FFFFFF" stroke="#D1BE8E" stroke-width="0.8">
    <g transform="translate(45, 680)">
      <circle cx="0" cy="-8" r="4.5"/><circle cx="8" cy="0" r="4.5"/>
      <circle cx="0" cy="8" r="4.5"/><circle cx="-8" cy="0" r="4.5"/>
      <circle cx="0" cy="0" r="3.2" fill="#E8C96C"/>
    </g>
    <g transform="translate(68, 735) scale(0.9)">
      <circle cx="0" cy="-8" r="4.5"/><circle cx="8" cy="0" r="4.5"/>
      <circle cx="0" cy="8" r="4.5"/><circle cx="-8" cy="0" r="4.5"/>
      <circle cx="0" cy="0" r="3.2" fill="#E8C96C"/>
    </g>
  </g>

  <!-- Jasmine White Flowers (Right Shore) -->
  <g fill="#FFFFFF" stroke="#D1BE8E" stroke-width="0.8">
    <g transform="translate(375, 695) scale(0.95)">
      <circle cx="0" cy="-8" r="4.5"/><circle cx="8" cy="0" r="4.5"/>
      <circle cx="0" cy="8" r="4.5"/><circle cx="-8" cy="0" r="4.5"/>
      <circle cx="0" cy="0" r="3.2" fill="#E8C96C"/>
    </g>
    <g transform="translate(350, 755) scale(0.85)">
      <circle cx="0" cy="-8" r="4.5"/><circle cx="8" cy="0" r="4.5"/>
      <circle cx="0" cy="8" r="4.5"/><circle cx="-8" cy="0" r="4.5"/>
      <circle cx="0" cy="0" r="3.2" fill="#E8C96C"/>
    </g>
  </g>

  <!-- Left Foreground Botanical Sprig (Rising gracefully up to middle screen) -->
  <path d="M-10 880 Q45 680 15 460" stroke="#3D5341" stroke-width="5" fill="none"/>
  
  <g transform="translate(18, 490) rotate(-40)">
    <path d="M0 0 C30 -14 65 -16 88 0 C65 22 30 18 0 0 Z" fill="#6A8570"/>
    <path d="M0 0 L88 0" stroke="#8EAA94" stroke-width="1.5"/>
  </g>
  <g transform="translate(25, 560) rotate(-25)">
    <path d="M0 0 C30 -14 65 -16 88 0 C65 22 30 18 0 0 Z" fill="#587460"/>
    <path d="M0 0 L88 0" stroke="#7B9983" stroke-width="1.5"/>
  </g>
  <g transform="translate(32, 630) rotate(-15)">
    <path d="M0 0 C32 -15 70 -18 95 0 C70 24 32 20 0 0 Z" fill="#6A8570"/>
  </g>
  <g transform="translate(36, 710) rotate(-10)">
    <path d="M0 0 C32 -15 70 -18 95 0 C70 24 32 20 0 0 Z" fill="#506C58"/>
  </g>

  <!-- Right Foreground Botanical Sprig (Rising from bottom-right) -->
  <path d="M430 880 Q375 700 405 520" stroke="#3D5341" stroke-width="5" fill="none"/>
  
  <g transform="translate(400, 550) rotate(145)">
    <path d="M0 0 C30 -14 65 -16 88 0 C65 22 30 18 0 0 Z" fill="#6A8570"/>
    <path d="M0 0 L88 0" stroke="#8EAA94" stroke-width="1.5"/>
  </g>
  <g transform="translate(390, 630) rotate(160)">
    <path d="M0 0 C30 -14 65 -16 88 0 C65 22 30 18 0 0 Z" fill="#587460"/>
    <path d="M0 0 L88 0" stroke="#7B9983" stroke-width="1.5"/>
  </g>
  <g transform="translate(385, 715) rotate(170)">
    <path d="M0 0 C32 -15 70 -18 95 0 C70 24 32 20 0 0 Z" fill="#6A8570"/>
  </g>
</svg>
